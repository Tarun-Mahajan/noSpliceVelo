  - name: dynamo_mouse_neural_nsv_studentT_time
    adata_path: ../data/dynamo_mouse_neural_studentT_time/nosplicevelo_score_gene_fit_v3_vote/adata_nosplicevelo_vote.h5ad
    dir_path: ../data/dynamo_mouse_neural_studentT_time/nosplicevelo_score_gene_fit_v3_4throot_type1_vote
    gene_query: "(fit_r2_complete_mu >= 0.01 & fit_r2_complete_var >= 0.01) & (sep_log2_z_naive.isna() | sep_log2_z_naive > -2.0) & (up_bow_z_fit.isna() | up_bow_z_fit <= 2.0 | up_bow_obs > 0.0) & (up_bow_misfit == False) & ((dispersions_norm >= @quant_) & (dispersions_norm >= 1.0))"
