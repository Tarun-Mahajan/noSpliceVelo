# Environment used for every step except cellDancer (Python 3.10, CUDA 12.1 wheels).
# Create with:  conda env create -f environment_gpu_final.yml && conda activate nsv_env
# On a machine without a CUDA GPU the same environment works on CPU (slowly).
# Benchmark methods run in this environment: scVelo 0.3.4, veloVI 0.3.1, VeloVAE 0.1.2,
# UniTVelo 0.2.5.2 and TFvelo 1.0 (from its GitHub repository); cellDancer 1.1.7 ran in a
# separate Python 3.7 environment (torch 1.10.0, scvelo 0.2.5). These packages are
# only needed to regenerate the competitor outputs, not to run noSpliceVelo.
name: nsv_env
